<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Perguntas</title>
</head>
<body>
    <h1><center>Lista de Perguntas</center></h1>

    <div id="resultado" style="margin-top: 15px;">Carregando perguntas...</div>

    <script>
        window.onload = function() {
            let xhr = new XMLHttpRequest();
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    document.getElementById("resultado").innerHTML = xhr.responseText;
                }
            };

            xhr.open("GET", "php/listar_perguntas.php", true);
            xhr.send();
        };
    </script>

    <br>
    <a href="criar_perguntas.html">Voltar</a>
</body>
</html>
