<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Perguntas</title>
</head>
<body>
    <h1><center>Criar Perguntas</center></h1>

    <form id="formulario">
        ID: <input type="text" id="id"><br>
        Informe a Pergunta: <input type="text" id="pergunta"><br>
        Questao1: <input type="text" id="questao1"><br>
        Questao2: <input type="text" id="questao2"><br>
        Questao3: <input type="text" id="questao3"><br>
        Questao4: <input type="text" id="questao4"><br>
        Resposta: <input type="text" id="resposta"><br>
        <br><button type="button" onclick="enviarPergunta()">Criar</button>
    </form>

    <h3 id="mensagem"></h3>

    <script>
        function enviarPergunta() {
            let id = document.getElementById("id").value;
            let pergunta = document.getElementById("pergunta").value;
            let questao1 = document.getElementById("questao1").value;
            let questao2 = document.getElementById("questao2").value;
            let questao3 = document.getElementById("questao3").value;
            let questao4 = document.getElementById("questao4").value;
            let resposta = document.getElementById("resposta").value;

            let url = "php/criar_perguntas.php?id=" + encodeURIComponent(id) + "&pergunta=" + encodeURIComponent(pergunta) + "&questao1=" + encodeURIComponent(questao1) + 
            "&questao2=" + encodeURIComponent(questao2) +"&questao3=" + encodeURIComponent(questao3) + "&questao4=" + encodeURIComponent(questao4) + "&resposta=" + encodeURIComponent(resposta);

            let xhr = new XMLHttpRequest();
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    document.getElementById("mensagem").innerText = xhr.responseText;
                    document.getElementById("formulario").reset();
                }
            };

            xhr.open("GET", url, true);
            xhr.send();
        }
    </script>

    <br><a href="criar_resposta.html">Cadastrar Resposta</a>
    <br><a href="alterar_perguntas.html">Alterar Perguntas</a>
    <br><a href="listar_perguntas.html">Listar Perguntas</a>
    <br><a href="listar_1pergunta.html">Listar Uma Pergunta</a>
    <br><a href="excluir_perguntas.html">Excluir Perguntas</a>
    <br><a href="usuarios/criar_usuario.html">Criar Usuarios</a>
</body>
</html>
